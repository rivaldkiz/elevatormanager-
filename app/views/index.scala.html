@(nom: String)(implicit flash: Flash)

@if(flash.get("success").isDefined) {
    <p class="bg-green-500/20 text-green p-4">@flash.get("success").get</p>
}

@if(flash.get("error").isDefined) {
    <p class="bg-red-500/20 text-red p-4">@flash.get("error").get</p>
}

@main("Welcome to Play") {
 <h1 class="text-3xl font-bold text-blue-600">
    Gestion des ascenseurs pour @nom
</h1>

}
