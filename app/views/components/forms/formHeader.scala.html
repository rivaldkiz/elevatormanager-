@(
  title: String,
  subtitle: Option[String] = None,
  badge: Option[(String, String)] = None    // (icône, texte)
)


<div class="flex items-start justify-between mb-6">
  <div>
    <h2 class="font-headline-lg text-headline-lg text-on-surface tracking-tight">@title</h2>
    @subtitle.map { s =>
      <p class="font-body-md text-body-md text-on-surface-variant mt-1">@s</p>
    }
  </div>

  @badge.map { case (icon, text) =>
    <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-surface-container text-secondary font-label-sm text-label-sm font-semibold shrink-0">
      <span class="material-symbols-outlined text-sm">@icon</span>
      @text
    </span>
  }
</div>
